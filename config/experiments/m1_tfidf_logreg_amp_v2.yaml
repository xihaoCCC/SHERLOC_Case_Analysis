{
  "config_id": "m1-tfidf-logreg-amp-v2",
  "config_version": "2.0.0",
  "status": "FROZEN_FOR_PHASE_4_EXECUTION",
  "method_id": "M1",
  "method_name": "TF-IDF plus one-vs-rest logistic regression",
  "primary_cohort_id": "sherloc-tip-2026-08-09-en-legacy-amp-complete-n1263-097ce2027171ebc9",
  "primary_cohort_n": 1263,
  "random_seed": 20260811,
  "input": {
    "field": "text_input.english_fact_summary_raw",
    "one_case_per_document": true,
    "excluded_fields": [
      "case title",
      "jurisdiction",
      "URL",
      "Legacy Keywords",
      "trafficking sidebar",
      "all other structured case metadata"
    ],
    "fit_preprocessing_on": "TRAIN_ONLY"
  },
  "targets": {
    "task_type": "multilabel_binary_relevance",
    "number_of_labels": 17,
    "label_order": [
      "ACT_RECRUITMENT",
      "ACT_TRANSPORTATION",
      "ACT_TRANSFER",
      "ACT_HARBOURING",
      "ACT_RECEIPT",
      "MEANS_THREAT_FORCE_OR_COERCION",
      "MEANS_ABDUCTION",
      "MEANS_FRAUD",
      "MEANS_DECEPTION",
      "MEANS_ABUSE_OF_POWER_OR_VULNERABILITY",
      "MEANS_PAYMENTS_OR_BENEFITS_FOR_CONTROL",
      "PURPOSE_SEXUAL_EXPLOITATION",
      "PURPOSE_FORCED_LABOUR_OR_SERVICES",
      "PURPOSE_SLAVERY_OR_SIMILAR_PRACTICES",
      "PURPOSE_SERVITUDE",
      "PURPOSE_REMOVAL_OF_ORGANS",
      "PURPOSE_OTHER"
    ],
    "geographic_form": "NOT_INCLUDED_AMP_PRIMARY_BENCHMARK"
  },
  "pipeline": {
    "vectorizer": {
      "class": "sklearn.feature_extraction.text.TfidfVectorizer",
      "analyzer": "word",
      "ngram_range": [1, 2],
      "lowercase": true,
      "strip_accents": null,
      "stop_words": null,
      "token_pattern": "(?u)\\b\\w\\w+\\b",
      "norm": "l2",
      "use_idf": true,
      "smooth_idf": true,
      "sublinear_tf": true,
      "min_df": 2,
      "max_df": 1.0,
      "max_features": 50000,
      "dtype": "float64"
    },
    "classifier_wrapper": {
      "class": "sklearn.multiclass.OneVsRestClassifier",
      "n_jobs": 1
    },
    "base_classifier": {
      "class": "sklearn.linear_model.LogisticRegression",
      "penalty": "l2",
      "solver": "liblinear",
      "C": 1.0,
      "class_weight": "balanced",
      "max_iter": 2000,
      "tol": 0.0001,
      "random_state": 20260811
    }
  },
  "validation_search": {
    "selection_data": "VALIDATION_ONLY",
    "selection_metric": "macro_average_precision",
    "refit_vectorizer_for_each_configuration_on": "TRAIN_ONLY",
    "grid": {
      "vectorizer.min_df": [1, 2],
      "base_classifier.C": [0.25, 1.0, 4.0],
      "base_classifier.class_weight": [null, "balanced"]
    },
    "maximum_configurations": 12,
    "tie_break": "earliest_configuration_in_frozen_grid",
    "test_labels_forbidden": true
  },
  "thresholding": {
    "fixed_baseline": 0.5,
    "primary_policy": "ONE_GLOBAL_THRESHOLD_TUNED_ON_VALIDATION_ONLY",
    "candidate_grid_start": 0.20,
    "candidate_grid_stop": 0.80,
    "candidate_grid_step": 0.05,
    "selection_metric": "macro_f1",
    "tie_break": "closest_to_0.50_then_lower_threshold",
    "per_label_thresholds": "DISABLED",
    "test_label_tuning": "PROHIBITED"
  },
  "reproducibility": {
    "split_status": "FINAL_FROZEN",
    "split_files": [
      "data/splits/a1_iid_split_final_v1.csv",
      "data/splits/a2_jurisdiction_folds_final_v1.csv"
    ],
    "runner": "src/experiments/08_run_m1_tfidf.py",
    "resume_policy": "SKIP_VALID_COMPLETE_RUN_OR_RESUME_FROM_VALID_FIT_STATE",
    "record_library_versions": true,
    "record_config_sha256": true,
    "persist_fitted_pipeline_vocabulary_and_idf": true
  },
  "expected_execution_environment": {
    "environment_name": "xihao_env",
    "python_version": "3.10.19",
    "scikit_learn_version": "1.7.2",
    "numpy_version": "2.2.6"
  },
  "scope_guard": {
    "train_now": true,
    "predict_now": true,
    "evaluate_test_metrics_in_runner": false,
    "future_test_error_prompt_or_model_tuning": false
  },
  "format_note": "This JSON document is valid YAML 1.2 and can be read with the Python standard library. It is a Phase-4 execution-only successor to m1_tfidf_logreg_v1.yaml; the model family and validation grid are unchanged, while final split paths and the frozen Phase-4 threshold grid are explicit."
}
