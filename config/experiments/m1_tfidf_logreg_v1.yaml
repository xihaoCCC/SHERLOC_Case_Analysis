      "class": "sklearn.linear_model.LogisticRegression",
      "penalty": "l2",
      "solver": "liblinear",
      "C": 1.0,
      "class_weight": "balanced",
      "max_iter": 2000,
      "tol": 0.0001,
      "random_state": 20260811
