  },
  "planned_validation_search": {
    "selection_data": "VALIDATION_ONLY",
    "selection_metric": "macro_average_precision",
    "refit_vectorizer_for_each_training_fold": true,
    "grid": {
      "vectorizer.min_df": [1, 2],
      "base_classifier.C": [0.25, 1.0, 4.0],
      "base_classifier.class_weight": [null, "balanced"]
