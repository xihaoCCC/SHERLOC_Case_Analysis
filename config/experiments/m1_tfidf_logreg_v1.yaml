    "maximum_configurations": 12,
    "test_labels_forbidden": true
  },
  "thresholding": {
    "fixed_baseline": 0.5,
    "primary_policy": "ONE_GLOBAL_THRESHOLD_TUNED_ON_VALIDATION_ONLY",
    "candidate_grid_start": 0.05,
    "candidate_grid_stop": 0.95,
    "candidate_grid_step": 0.05,
    "selection_metric": "macro_f1",
