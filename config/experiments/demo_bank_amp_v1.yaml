      "fact_summary": "A Micronesian couple was indicted by a federal grand jury for recruiting a 19-year-old girl from Micronesia to work in their home in the United States without paying her. They had promised the victim an education and the opportunity to travel in the United States, but instead, they forced her into domestic servitude. The couple arranged for the girl to obtain a passport to travel from Micronesia to Tacoma, Washington, and they also obtained a social security card in the victim’s name, concealed the card from her, and forced her to work at a chicken processing plant. In addition to forcing her to perform domestic labour such as cooking, cleaning, and childcare without pay, the defendants withheld all of her earnings from the chicken processing plant. They isolated the woman in their home, did not allow her to leave the home unmonitored, and controlled her passport to compel her labour. After a year, the victim escaped, partly thanks to the help of what the Department of Justice press release described as “an alert neighbour.”",
