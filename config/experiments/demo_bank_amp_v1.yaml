      "fact_summary": "In this case in Tongeren, a Nigerian network of traffickers in women was dismantled. The organisation also had branches in the Netherlands and in Spain and was active in large-scale money laundering activities and credit card fraud. One of the victims was a Nigerian minor.\n\nThe girls were recruited in Nigeria under all sorts of pretexts and were transported illegally into Belgium via Greece in order to work as escort-girls in the prostitution world. They had to pay back the travel costs through prostitution. The defendants took advantage of voodoo rituals to instil fear in the victims. The Nigerian girls were forced to submit to extreme forms of sex on dirty mattresses and had to work day and night. There was virtually no hygiene; even the customers complained about the filthy premises and the unpleasant odours.\n\nThe victims were staying irregularly in Belgium. It is precisely this precarious and dependent situation that leaves these victims no other choice than to let themselves be exploited. The statements of the victims illustrated in detail how they were manipulated, deceived and intimidated. One of the victims was physically abused and locked in a room when the defendants discovered that she had withheld part of the money earned from the customers. When she refused to spontaneously hand over the money, the defendant struck her in order to try to take the money from her hands. He locked her up in the room where she was then staying and took away her telephone to prevent her from communicating with the outside world. He would return later, after work, to sort things out. In the meantime the victim was able to escape with the help of the neighbour.",
