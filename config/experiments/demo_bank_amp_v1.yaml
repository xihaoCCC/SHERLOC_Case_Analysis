      "fact_summary": "The defendant is an Israeli citizen who met the complainants, the mother and her 10 years old daughter who lived in Georgia, through the internet. The defendant persisted in an on-line relations with the mother, as well as later upon his arrival to Georgia, where he met her and the daughter, bought the child gifts, went out with them and wired money for them from Israel. Later, according to the indictment, the defendant arrived to a hotel in Tbilisi and asked the mother and daughter to join him. The defendant and the mother reached an agreement according to which he will pay her a monthly payments of 100$ and in exchange she will allow him to use her daughter's body for the production of pornographic material and conducting sexual acts.\nAccording to this agreement, in two cases, the defendant arrived to the hotel in Tbilisi and the mother brought the daughter there. In the hotel room, the defendant took obscene photos of the minor and sexually assaulted her, including partial penetration while visually recording the acts by several cameras belonging to him and the mother.\nThe defendant gave the mother a camera and a laptop so she can produce pedophile photos of the minor at his will. The mother emailed the photos to the defendant and he paid her. Later on, the defendant published and sold the photos and films. Additionally, the defendant held in his possession many other obscene materials of other minors, which he also published.",
